about:
  h1: Depuis 1963, de l’arbre à l’expédition.
  lead: "Standart Entegre est un fabricant intégré d’emballages en bois qui réunit un long héritage industriel, une vision moderne de l’industrie et une approche respectueuse de la nature."
  story_eyebrow: Notre histoire
  story:
  - "L’histoire de notre entreprise dans les produits forestiers remonte à 1946, et notre fabrication d’emballages en bois et de tourets de câble à 1963. Depuis, à travers nos différentes sociétés, nous avons fabriqué des tourets de câble, des palettes en bois et des caisses à boissons, en répondant aux besoins d’expédition croissants de l’industrie turque."
  - "« Entegre » signifie intégré, et décrit notre façon de travailler. Le sciage des grumes, la préparation du bois, la fabrication des tourets et des caisses et l’expédition se font au sein d’une même structure. Nous préparons notre matière première en sciant nous-mêmes les grumes, et importons aussi des planches et des blocs compressés."
  - "Dans nos usines de Gebze et Denizli, nous fabriquons des tourets de câble en bois et en contreplaqué, des pièces de tourets en kit, des caisses pliables en bois, des caisses de transport et d’exportation et des caisses à marbre. Nos clients sont des câbliers énergie et télécommunications, des fabricants de câbles d’acier et de fils, des entreprises du marbre et de la pierre naturelle et des industriels exportateurs."
  - "Chaque commande part de la charge : la section et la longueur du câble, la taille des tranches, le poids de la machine. Nous fabriquons des tourets en bois de 55 cm à 320 cm de diamètre de joue, en tailles standard comme sur mesure."
