sustain:
  eyebrow: Nature et durabilité
  h: ['Le bois, matériau renouvelable de la nature.', Nous le travaillons de façon responsable.]
  lead: "Notre matière première vient de la forêt. À chaque étape de la production, nous tenons compte de notre responsabilité envers la nature : utiliser la matière avec efficacité, fabriquer des produits durables et rendre à la nature."
  pillars:
  - [Matière renouvelable, "Bien gérée, la forêt se renouvelle. De la découpe à la fabrication, nous utilisons la matière avec efficacité et réduisons les chutes au minimum."]
  - [Réemploi et recyclage, "Les tourets et palettes en bois se réutilisent de nombreuses fois. Nous œuvrons au recyclage du bois en fin de vie."]
  - [Des arbres pour nos clients, "Chaque année, nous plantons des arbres au nom de nos clients, pour rendre à la nature le bois que nous utilisons."]
  - [Des déchets à l’énergie, "Les déchets de bois de la production sont valorisés en granulés de bois pour le secteur de l’énergie."]
  more: Découvrir notre démarche
  planting_eyebrow: Responsabilité sociale
  planting_h: Chaque année, des arbres au nom de nos clients.
  planting_p: "Chaque année, nous plantons de jeunes arbres au nom de nos clients. Chaque touret et chaque palette commence par un arbre de la forêt ; le remplacer fait partie de notre métier."
  recycling_h: Partenariat international de recyclage
  recycling_p: "Nous menons un partenariat de recyclage lié à la France afin de valoriser les emballages en bois arrivés en fin de vie."
  labels:
    partner: Organisme partenaire
    trees_total: Arbres plantés
    since: Programme depuis
