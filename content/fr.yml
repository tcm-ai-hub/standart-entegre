heritage:
  eyebrow: Entreprise · Depuis 1963
  year_caption: "L’année où nous avons commencé à fabriquer emballages en bois et tourets de câble"
  h: "Un long héritage industriel, une vision moderne de l’industrie."
  story:
  - "L’histoire de notre entreprise dans les produits forestiers remonte à 1946. En 1963, nous avons commencé à fabriquer des emballages en bois et des tourets de câble ; au fil des années, à travers nos différentes sociétés, nous avons fabriqué tourets, palettes en bois et caisses à boissons, en grandissant avec les besoins d’expédition de l’industrie."
  - "Aujourd’hui, nous poursuivons ce savoir-faire sous le nom de Standart Entegre. Dans nos usines de Gebze et Denizli, une chaîne intégrée de la grume à l’expédition produit tourets en bois et en contreplaqué, kits, caisses pliables, caisses et caisses à marbre."
  timeline:
  - ['1946', Produits forestiers, "Le début de l’histoire de notre entreprise dans les produits forestiers."]
  - ['1963', Emballages en bois et tourets, "Début de la fabrication d’emballages en bois et de tourets de câble."]
  - [Les années suivantes, 'Caisses, tourets, palettes', "Caisses à boissons, tourets de câble et palettes en bois, fabriqués par nos différentes sociétés."]
  - [Aujourd’hui, Standart Entegre, "Production intégrée de la grume à l’expédition ; six familles de produits à Gebze et Denizli, marché intérieur et export."]
