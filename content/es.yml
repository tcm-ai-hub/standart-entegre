heritage:
  eyebrow: Empresa · Desde 1963
  year_caption: "El año en que empezamos a fabricar embalaje de madera y bobinas para cable"
  h: "Una larga trayectoria industrial, una visión moderna de la industria."
  story:
  - "La historia de nuestra empresa en productos forestales se remonta a 1946. En 1963 empezamos a fabricar embalaje de madera y bobinas para cable; a lo largo de los años, a través de nuestras distintas empresas, fabricamos bobinas, palets de madera y cajas para refrescos, y crecimos junto con las necesidades de envío de la industria."
  - "Hoy continuamos esa experiencia como Standart Entegre. En nuestras plantas de Gebze y Denizli, una cadena integrada del tronco al envío produce bobinas de madera y de contrachapado, kits, cajas plegables, cajas y cajas para mármol."
  timeline:
  - ['1946', Productos forestales, "El inicio de la historia de nuestra empresa en productos forestales."]
  - ['1963', Embalaje de madera y bobinas, "Empezamos a fabricar embalaje de madera y bobinas para cable."]
  - [Los años siguientes, 'Cajas, bobinas, palets', "Cajas para refrescos, bobinas para cable y palets de madera, fabricados por nuestras distintas empresas."]
  - [Hoy, Standart Entegre, "Producción integrada del tronco al envío; seis familias de productos en Gebze y Denizli, mercado nacional y exportación."]
  more: Lea nuestra historia
sustain:
  eyebrow: Naturaleza y sostenibilidad
  h: ['La madera, el material renovable de la naturaleza.', La trabajamos con responsabilidad.]
  lead: "Nuestra materia prima viene del bosque. Por eso, en cada paso de la producción tenemos en cuenta nuestra responsabilidad con la naturaleza: usar la materia prima con eficiencia, fabricar productos duraderos y devolver a la naturaleza."
  pillars:
  - [Materia prima renovable, "Bien gestionada, la madera es un recurso que vuelve a crecer. Del corte a la fabricación usamos la materia prima con eficiencia y reducimos los residuos al mínimo."]
  - [Reutilización y reciclaje, "Las bobinas y palets de madera se reutilizan muchas veces. Trabajamos para reciclar la madera al final de su vida útil."]
  - [Árboles por nuestros clientes, "Cada año plantamos árboles en nombre de nuestros clientes, como forma de devolver la madera que usamos."]
  - [De residuo a energía, "Los residuos de madera de la producción se recuperan como pellets de madera para el sector energético."]
  more: Conozca nuestro enfoque
  planting_eyebrow: Responsabilidad social
  planting_h: Cada año, árboles en nombre de nuestros clientes.
  planting_p: "Cada año plantamos árboles jóvenes en nombre de nuestros clientes. Cada bobina y cada palet empieza con un árbol del bosque; reponerlo forma parte de nuestro trabajo."
  recycling_h: Colaboración internacional de reciclaje
  recycling_p: "Mantenemos una colaboración de reciclaje vinculada a Francia para dar nuevo uso al embalaje de madera al final de su vida útil."
