      - ["¿Qué datos necesitan para un presupuesto?", "Tipo de cable, diámetro exterior, longitud total, diámetro de ala deseado si lo conoce, y cantidad. Adjunte un plano si lo tiene."]
      - ["¿Caben las bobinas grandes en un contenedor?", "La puerta de un contenedor estándar mide unos 2,28 m de alto y la de un high-cube unos 2,58 m. Diámetros mayores pueden requerir envío open-top o flat-rack."]
