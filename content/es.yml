  process_eyebrow: "Proceso de producción"
  process:
    - ["Troncos y materia prima", "Recepción y clasificación de troncos; tablas y tacos prensados importados."]
    - ["Aserrado", "Troncos cortados a medida; preparación de la madera."]
    - ["Fabricación", "Alas, tambores, palets, cajas y cajas para mármol; montaje."]
    - ["Control", "Control de medidas, uniones y montaje."]
