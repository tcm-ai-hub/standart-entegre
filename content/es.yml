sustain:
  eyebrow: "Naturaleza y sostenibilidad"
  h: ["La madera, el material renovable de la naturaleza.", "La trabajamos con responsabilidad."]
  lead: "Nuestra materia prima viene del bosque. Por eso, en cada paso de la producción tenemos en cuenta nuestra responsabilidad con la naturaleza: usar la materia prima con eficiencia, fabricar productos duraderos y devolver a la naturaleza."
  pillars:
    - ["Materia prima renovable", "Bien gestionada, la madera es un recurso que vuelve a crecer. Del corte a la fabricación usamos la materia prima con eficiencia y reducimos los residuos al mínimo."]
    - ["Reutilización y reciclaje", "Las bobinas y palets de madera se reutilizan muchas veces. Trabajamos para reciclar la madera al final de su vida útil."]
    - ["Árboles por nuestros clientes", "Cada año plantamos árboles en nombre de nuestros clientes, como forma de devolver la madera que usamos."]
  more: "Conozca nuestro enfoque"
  planting_eyebrow: "Responsabilidad social"
  planting_h: "Cada año, árboles en nombre de nuestros clientes."
