about:
  h1: Desde 1963, del árbol al envío.
  lead: "Standart Entegre es un fabricante integrado de embalaje de madera que une una larga trayectoria industrial, una visión moderna de la industria y un enfoque respetuoso con la naturaleza."
  story_eyebrow: Nuestra historia
  story:
  - "La historia de nuestra empresa en productos forestales se remonta a 1946, y nuestra fabricación de embalaje de madera y bobinas para cable, a 1963. Desde entonces, a través de nuestras distintas empresas, hemos fabricado bobinas para cable, palets de madera y cajas para refrescos, respondiendo a las crecientes necesidades de envío de la industria turca."
  - "«Entegre» significa integrado y describe nuestra forma de trabajar. El aserrado de troncos, la preparación de la madera, la fabricación de bobinas y cajas y el envío se realizan dentro de una misma estructura. Preparamos la materia prima aserrando nosotros mismos los troncos y también importamos tablas y tacos prensados."
  - "En nuestras plantas de Gebze y Denizli fabricamos bobinas para cable de madera y de contrachapado, piezas de bobina en kit, cajas plegables de madera, cajas de transporte y exportación y cajas para mármol. Nuestros clientes son fabricantes de cable de energía y telecomunicaciones, productores de cable de acero y alambre, empresas de mármol y piedra natural e industrias exportadoras."
  - "Cada pedido empieza por la carga: la sección y longitud del cable, la medida de la tabla, el peso de la máquina. Fabricamos bobinas de madera de 55 cm a 320 cm de diámetro de ala, en medidas estándar y a medida de cada proyecto."
  history_eyebrow: Historia
  facility_eyebrow: Planta y capacidad
  facts_fixed:
  - ['1946', Nuestras raíces en productos forestales]
  - ['1963', Inicio del embalaje de madera y las bobinas para cable]
  - [Más de 60 años, De experiencia en embalaje de madera y bobinas]
  - [Ø 55 cm – 320 cm, Diámetro de ala]
