# ---------------------------------------------------------------
# Standart Entegre · site ayarları (tüm diller için ortak)
# Metinler dil dosyalarında: tr.yml, en.yml, fr.yml, ar.yml, es.yml
# ---------------------------------------------------------------

# Sitenin yayın adresi. Domain alınınca burayı değiştirin (sonunda / olsun).
base_url: "https://standartentegre.com/"

brand: "Standart Entegre"

# Footer'daki "Tasarım: TCM Global" yazısının linki
credit_url: "https://www.tcmglobal.com.tr"

# İlk dil kök dizinde yayınlanır, diğerleri /en/, /fr/ ... altında.
languages: [tr, en, fr, ar, es]

# Teklif formunun gönderileceği adres (Formspree, Web3Forms veya n8n webhook).
# Boşken form önizleme mesajı gösterir.
form_endpoint: "https://formsubmit.co/ajax/info@standartentegre.com"

# Makara üretim ölçüsü (santimetre)
reel_min_cm: 55
reel_max_cm: 320
# Ölçü aracındaki ara görünüş üst sınırı (standart konteyner kapısı ≈ 228 cm)
reel_mid_cm: 228

# ---------------------------------------------------------------
# Şirket bilgileri. Boş bırakılan alan sitede görünmez.
# ---------------------------------------------------------------
company:
  founded: ""            # örn. "1998"
  facility_area_m2: ""   # örn. "12.000"
  lumber_m3_year: ""     # yıllık kereste, örn. "15.000"
  reels_year: ""         # yıllık makara adedi, örn. "40.000"
  employees: ""          # örn. "60"
  phone: ""
  email: "info@standartentegre.com"
  address: ""
  city: "Gebze, Kocaeli"
  # Üretim tesisleri (sitede listelenir)
  facilities: ["Gebze, Kocaeli", "Denizli"]
  heritage_year: "1963"  # üretim geçmişinin başladığı yıl
  # Belgeler: her biri için kısa ad ve (varsa) görsel yolu
  certificates: []
  #  - name: "ISO 9001:2015"

# ---------------------------------------------------------------
# Standartlar ve belgeler.
# Kapsamı ve kullanım izni şirket belgeleriyle teyit edilince "true" yapın;
# metinler sitede (ürün sayfaları, Kurumsal) otomatik görünür.
# ---------------------------------------------------------------
standards:
  ispm15: false   # ürünlerin ISPM 15 kapsamında tedarik edildiği bilgisi
  fsc: false      # FSC belgesi (geçerlilik ve logo kullanım izni teyidi sonrası)

# ---------------------------------------------------------------
# Ürünler: sıra, kategori ve görsel. Metinler dil dosyalarında.
# ---------------------------------------------------------------
products:
  - key: makara
    category: makaralar
    image: assets/img/render-makara.webp
    detail_image: assets/img/render-makara-parca.webp
    detail_wide: true
  - key: kontrplak
    category: makaralar
    image: assets/img/render-kontrplak.webp
  - key: kit
    category: makaralar
    image: assets/img/render-kit.webp
  - key: katlanabilir
    category: ambalaj
    image: assets/img/render-katlanabilir.webp
  - key: sandik
    category: ambalaj
    image: assets/img/render-sandik.webp
  - key: mermer
    category: ambalaj
    image: assets/img/render-mermer.webp

categories: [makaralar, ambalaj]

# ---------------------------------------------------------------
# GÖRSELLER
# "src" bir dosya yolu (assets/img/...) ya da bir https adresi olabilir.
# https adresleri yayına alırken otomatik indirilir ve siteyle birlikte sunulur.
# Kendi fabrika/üretim fotoğraflarınız hazır olunca: dosyayı assets/img/kurumsal/
# klasörüne yükleyin, ilgili "src" satırını o dosya yoluyla değiştirin.
# Önerilen ölçü: 1800 × 1200 px veya daha büyük, JPG.
# Açıklama metinleri dil dosyalarında (gallery bölümü).
# Şu anki fotoğraflar Unsplash'ten (ücretsiz ticari kullanım lisansı), temsilidir.
# ---------------------------------------------------------------

# Ana sayfa kapağı: 3D makaranın arkasında akan görseller (doğa → ahşap → üretim → ürün)
hero_images:
  - key: orman
    src: "https://images.unsplash.com/photo-1542273917363-3b1817f69a2d"
  - key: orman_isik
    src: "https://images.unsplash.com/photo-1605714726527-411541ab17f4"
  - key: tomruk
    src: "https://images.unsplash.com/photo-1417026846249-f31f7e43fc35"
  - key: kereste
    src: "https://images.unsplash.com/photo-1634672652995-ee7525bce595"
  - key: makara
    src: "https://images.unsplash.com/photo-1777269390102-2284b67b9183"

# Kurumsal bölümünde ve Kurumsal sayfa kapağında akan görseller
gallery:
  - key: orman
    src: "https://images.unsplash.com/photo-1542273917363-3b1817f69a2d"
  - key: tomruk
    src: "https://images.unsplash.com/photo-1417026846249-f31f7e43fc35"
  - key: kesim
    src: "https://images.unsplash.com/photo-1749572855201-feb5cf658479"
  - key: kereste
    src: "https://images.unsplash.com/photo-1634672652995-ee7525bce595"
  - key: makara
    src: "https://images.unsplash.com/photo-1777269390102-2284b67b9183"
  - key: palet
    src: "https://images.unsplash.com/photo-1729161632263-a0e0da501895"

# Doğa ve sürdürülebilirlik bölümü görselleri
sustain_images:
  main: "https://images.unsplash.com/photo-1502252430442-aac78f397426"
  planting: "https://images.unsplash.com/photo-1641320201668-1b2bedb4a066"

# ---------------------------------------------------------------
# Ağaç dikimi ve geri dönüşüm (Kurumsal sayfa).
# Kurum ve uygulama detayları netleşince doldurun; boş alan sitede görünmez.
# ---------------------------------------------------------------
planting:
  partner: ""        # ağaçların dikildiği kurum / vakıf, örn. "TEMA Vakfı"
  trees_total: ""    # bugüne kadar dikilen ağaç, örn. "12.000"
  since: ""          # uygulamanın başladığı yıl, örn. "2015"
