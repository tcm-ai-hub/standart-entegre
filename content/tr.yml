about:
  h1: 1963’ten bugüne, ağaçtan sevkiyata.
  lead: "Standart Entegre; köklü üretim geçmişini, modern sanayi anlayışını ve doğaya duyarlı yaklaşımı bir araya getiren entegre bir ahşap ambalaj üreticisidir."
  story_eyebrow: Hikâyemiz
  story:
  - "Orman ürünlerindeki firma geçmişimiz 1946’ya, ahşap ambalaj malzemesi ve kablo makarası üretimimiz 1963’e uzanıyor. O günden bu yana farklı firmalarımız aracılığıyla kablo makarası, ahşap palet ve meşrubat sandığı ürettik; Türkiye sanayisinin büyüyen sevkiyat ihtiyacına cevap verdik."
  - "Adımızdaki “entegre” bir üretim biçimini anlatır. Tomruk kesiminden kereste hazırlığına, makara ve sandık imalatından sevkiyata kadar işin tamamını aynı yapı içinde yürütürüz. Hammaddeyi tomruk kesimiyle kendimiz hazırlar, tahta ve sıkıştırılmış takozu ithalat yoluyla da tedarik ederiz."
  - "Gebze ve Denizli tesislerimizde ahşap ve kontrplak kablo makaraları, kit paket makara parçaları, katlanabilir ahşap kasalar, taşıma ve ihracat sandıkları ile mermer kasaları üretiyoruz. Müşterilerimiz enerji ve telekomünikasyon kablosu üreticileri, çelik halat ve tel üreticileri, mermer ve doğal taş firmaları ve ihracat yapan sanayi kuruluşlarıdır."
  - "Her siparişe yükten başlarız: kablonun kesiti ve boyu, plakanın ölçüsü, makinenin ağırlığı. Ahşap makaralarda 55 cm’den 320 cm’ye kadar yanak çapında üretim yapıyor, standart makara ölçülerinin yanında projeye özel ölçüler de hazırlıyoruz."
  history_eyebrow: Tarihçe
  facility_eyebrow: Tesis ve kapasite
  facts_fixed:
  - ['1946', Orman ürünlerinde firma geçmişi]
  - ['1963', Ahşap ambalaj ve kablo makarası üretiminin başlangıcı]
  - [60+ yıl, Ahşap ambalaj malzemesi ve kablo makarası üretiminde deneyim]
  - [Ø 55 cm – 320 cm, Makara yanak çapı]
  - ['6', Ürün ailesi]
  - [Gebze · Denizli, Üretim tesisleri]
