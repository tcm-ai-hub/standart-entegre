heritage:
  eyebrow: Kurumsal · 1963’ten bugüne
  year_caption: "Ahşap ambalaj malzemesi ve kablo makarası üretimine başladığımız yıl"
  h: Köklü bir üretim geçmişi, modern bir sanayi anlayışı.
  story:
  - "Orman ürünlerindeki firma geçmişimiz 1946’ya uzanıyor. 1963’te ahşap ambalaj malzemesi ve kablo makarası üretimine başladık; yıllar içinde farklı firmalarımız aracılığıyla kablo makarası, ahşap palet ve meşrubat sandığı ürettik, sanayinin büyüyen sevkiyat ihtiyacıyla birlikte büyüdük."
  - "Bugün bu birikimi Standart Entegre çatısı altında sürdürüyoruz. Gebze ve Denizli tesislerimizde tomruktan sevkiyata uzanan entegre bir üretim zinciriyle ahşap ve kontrplak makara, kit paket, katlanabilir kasa, sandık ve mermer kasası üretiyoruz."
  timeline:
  - ['1946', Orman ürünleri, Orman ürünlerindeki firma geçmişimizin başlangıcı.]
  - ['1963', Ahşap ambalaj ve kablo makarası, "Ahşap ambalaj malzemesi ve kablo makarası üretimine başladık."]
  - [Sonraki yıllar, 'Sandık, makara, palet', "Farklı firmalarımız aracılığıyla meşrubat sandığı, kablo makarası ve ahşap palet üretimi."]
  - [Bugün, Standart Entegre, "Tomruktan sevkiyata entegre üretim; Gebze ve Denizli’de altı ürün ailesi, yurt içi ve ihracat."]
  more: Hikâyemizi okuyun
sustain:
  eyebrow: Doğa ve sürdürülebilirlik
  h: ['Ahşap, doğanın yenilenen malzemesi.', Onu sorumlulukla işliyoruz.]
  lead: "Ürünlerimizin hammaddesi ormandan geliyor. Bu yüzden üretimin her adımında doğaya karşı sorumluluğumuzu da hesaba katıyoruz: hammaddeyi verimli kullanmak, ürünü uzun ömürlü yapmak ve doğaya geri kazandırmak."
  pillars:
  - [Yenilenebilir hammadde, "Ahşap, doğru yönetildiğinde yeniden yetişen bir kaynaktır. Kesimden imalata hammaddeyi verimli kullanır, artığı en aza indiririz."]
  - [Tekrar kullanım ve geri dönüşüm, "Ahşap makara ve paletler defalarca kullanılabilir. Ömrünü tamamlayan ahşabın geri dönüşüme kazandırılması için çalışıyoruz."]
  - [Müşterilerimiz adına ağaç, "Her yıl müşterilerimiz adına ağaç dikiyoruz; kullandığımız ahşabı doğaya geri kazandırmanın bir yolu olarak."]
  - [Atıktan enerjiye, "Ahşap üretim atıklarını ahşap pelet olarak enerji sektörüne yeniden kazandırıyoruz."]
