about:
  h1: منذ عام 1963، من الشجرة حتى الشحن.
  lead: "Standart Entegre شركة متكاملة لتصنيع التغليف الخشبي تجمع بين تاريخ إنتاج عريق ورؤية صناعية حديثة ونهج يراعي الطبيعة."
  story_eyebrow: قصتنا
  story:
  - "يعود تاريخ شركتنا في منتجات الغابات إلى عام 1946، ويعود تصنيعنا لمواد التغليف الخشبية وبكرات الكابلات إلى عام 1963. ومنذ ذلك الحين، ومن خلال شركاتنا المختلفة، صنعنا بكرات الكابلات والمنصات الخشبية وصناديق المشروبات الغازية، ولبّينا احتياجات الشحن المتزايدة للصناعة التركية."
  - "كلمة «Entegre» في اسمنا تعني «متكامل»، وهي تصف طريقة عملنا. قطع الجذوع وتجهيز الأخشاب وتصنيع البكرات والصناديق والشحن تتم جميعها ضمن منظومة واحدة. نجهّز المادة الخام بقطع الجذوع بأنفسنا، ونستورد أيضاً الألواح والقطع المضغوطة."
  - "في مصنعينا في جبزة ودنيزلي نصنع بكرات كابلات من الخشب والخشب الرقائقي، وأجزاء بكرات على شكل أطقم، وصناديق خشبية قابلة للطي، وصناديق نقل وتصدير، وصناديق رخام. عملاؤنا هم مصنّعو كابلات الطاقة والاتصالات، ومنتجو الحبال الفولاذية والأسلاك، وشركات الرخام والحجر الطبيعي، والمصانع المصدّرة."
  - "يبدأ كل طلب من الحمولة: مقطع الكابل وطوله، مقاس اللوح، وزن الآلة. نصنع بكرات خشبية بقطر جوانب من 55 سم إلى 320 سم، بمقاسات قياسية ومخصصة لكل مشروع."
  history_eyebrow: تاريخنا
  facility_eyebrow: المصنع والطاقة الإنتاجية
