sustain:
  eyebrow: الطبيعة والاستدامة
  h: [الخشب مادة الطبيعة المتجددة., ونحن نعمل به بمسؤولية.]
  lead: "تأتي مادتنا الخام من الغابة، لذلك نراعي مسؤوليتنا تجاه الطبيعة في كل مرحلة من مراحل الإنتاج: استخدام المادة الخام بكفاءة، وصنع منتجات تدوم طويلاً، وردّ الجميل للطبيعة."
  pillars:
  - [مادة خام متجددة, "الخشب، إذا أُحسنت إدارته، مورد يتجدد. من القطع إلى التصنيع نستخدم المادة الخام بكفاءة ونقلل الهدر إلى أدنى حد."]
  - [إعادة الاستخدام والتدوير, "يمكن استخدام البكرات والمنصات الخشبية مرات عديدة. ونعمل على إعادة تدوير الخشب الذي انتهى عمره."]
  - [أشجار باسم عملائنا, "نزرع كل عام أشجاراً باسم عملائنا، طريقةً لنعيد إلى الطبيعة الخشب الذي نستخدمه."]
  - [من المخلفات إلى الطاقة, "نعيد تدوير مخلفات الخشب الناتجة عن الإنتاج على شكل حبيبات خشبية (بيليت) لقطاع الطاقة."]
  more: تعرّف على نهجنا
  planting_eyebrow: المسؤولية الاجتماعية
  planting_h: كل عام، أشجار باسم عملائنا.
  planting_p: "نزرع كل عام شتلات باسم عملائنا. كل بكرة وكل منصة نصنعها تبدأ بشجرة من الغابة، وتعويض تلك الشجرة جزء من عملنا."
  recycling_h: شراكة دولية لإعادة التدوير
  recycling_p: "ندير شراكة لإعادة التدوير مرتبطة بفرنسا لإعادة الاستفادة من التغليف الخشبي الذي انتهى عمره."
