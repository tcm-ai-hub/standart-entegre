    - [هل تدخل البكرات الكبيرة في الحاوية؟, "يبلغ ارتفاع باب الحاوية القياسية نحو 228 سم، وباب حاوية high-cube نحو 258 سم. قد تحتاج الأقطار الأكبر إلى شحن بحاوية مفتوحة السقف أو flat-rack."]
