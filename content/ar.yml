  h: تاريخ إنتاج عريق، ورؤية صناعية حديثة.
  story:
  - "يعود تاريخ شركتنا في منتجات الغابات إلى عام 1946. وفي عام 1963 بدأنا تصنيع مواد التغليف الخشبية وبكرات الكابلات، وعلى مر السنين، ومن خلال شركاتنا المختلفة، صنعنا البكرات والمنصات الخشبية وصناديق المشروبات الغازية، ونمونا مع نمو احتياجات الشحن في الصناعة."
